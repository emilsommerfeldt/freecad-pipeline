name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: freecad-builder:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run sample build and verify
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          chmod 777 "$RUNNER_TEMP/models"
          docker run -d --name freecad-builder \
            -v "$RUNNER_TEMP/models:/models" \
            freecad-builder:smoke
          docker exec freecad-builder freecadcmd /models/build_part.py \
            | tee "$RUNNER_TEMP/stdout.json"
          docker exec freecad-builder test -s /models/l-bracket.FCStd
          docker exec freecad-builder test -s /models/l-bracket.stl
          docker exec freecad-builder test -s /models/l-bracket.verification.json
          python3 -c \
            "import json,sys; r=json.load(open('$RUNNER_TEMP/models/l-bracket.verification.json')); sys.exit(0 if r['all_pass'] else 1)"

      - name: MCP endpoint smoke test
        run: |
          docker run -d --name freecad-mcp \
            -e FREECAD_MCP_TOKEN=ci-token \
            -v "$RUNNER_TEMP/models:/models" \
            -p 127.0.0.1:8410:8410 \
            --entrypoint /opt/freecad/usr/bin/python \
            freecad-builder:smoke /opt/freecad-pipeline/mcp_server.py
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8410/mcp)" = "401" ] && break
            sleep 2
          done
          curl -s -o /dev/null -w 'no-token=%{http_code}\n' http://127.0.0.1:8410/mcp | grep -q 'no-token=401'
          pip install fastmcp
          python3 -c '
          import asyncio, json, os
          from fastmcp import Client
          from fastmcp.client.auth import BearerAuth

          async def main():
              async with Client("http://127.0.0.1:8410/mcp",
                                auth=BearerAuth(token="ci-token")) as c:
                  spec = json.load(open(os.environ["RUNNER_TEMP"] + "/models/spec.json"))
                  r = await c.call_tool("build_part", {"spec": spec})
                  d = r.data if isinstance(r.data, dict) else json.loads(r.content[0].text)
                  assert d.get("all_pass") is True, d
                  print("MCP build_part: all_pass")

          asyncio.run(main())
          '
          docker rm -f freecad-mcp

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
