name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: freecad-builder:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run sample build and verify
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          chmod 777 "$RUNNER_TEMP/models"
          docker run -d --name freecad-builder \
            -v "$RUNNER_TEMP/models:/models" \
            freecad-builder:smoke
          docker exec freecad-builder freecadcmd /models/build_part.py \
            | tee "$RUNNER_TEMP/stdout.json"
          docker exec freecad-builder test -s /models/l-bracket.FCStd
          docker exec freecad-builder test -s /models/l-bracket.stl
          docker exec freecad-builder test -s /models/l-bracket.verification.json
          python3 -c \
            "import json,sys; r=json.load(open('$RUNNER_TEMP/models/l-bracket.verification.json')); sys.exit(0 if r['all_pass'] else 1)"
          docker rm -f freecad-builder

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
