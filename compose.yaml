# Deployment for a Docker host (Proxmox VM recommended — see DEPLOY.md).
# Generate a token first: openssl rand -hex 32, and replace CHANGE_ME.
services:
  freecad-builder:
    image: ghcr.io/emilsommerfeldt/freecad-pipeline:latest
    container_name: freecad-builder
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    volumes:
      - ./models:/models

  # MCP endpoint for remote Vibe Work sessions. Publishes only to the
  # host loopback; expose it to the internet solely through an encrypted,
  # access-controlled tunnel (see DEPLOY.md).
  freecad-mcp:
    image: ghcr.io/emilsommerfeldt/freecad-pipeline:latest
    container_name: freecad-mcp
    restart: unless-stopped
    entrypoint: ["/opt/freecad/usr/bin/python", "/opt/freecad-pipeline/mcp_server.py"]
    environment:
      FREECAD_MCP_TOKEN: "CHANGE_ME"
      MODELS_DIR: "/models"
    volumes:
      - ./models:/models
    ports:
      - "127.0.0.1:8410:8410"
